dbt_transformation:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('DBT_ENV_SECRET_ACCOUNT') }}"
      user: "{{ env_var('DBT_ENV_SECRET_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      role: "{{ env_var('DBT_ROLE', 'DBT_TRANSFORMER') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('DBT_DATABASE', 'ANALYTICS') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'DBT_DEV') }}"
      threads: 4
