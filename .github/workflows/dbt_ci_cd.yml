name: dbt_pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DBT_ENV_SECRET_ACCOUNT: local_account
      DBT_ENV_SECRET_USER: local_user
      DBT_ENV_SECRET_PASSWORD: local_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer dbt
        run: pip install -r requirements-dbt.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q dags
      - name: Valider le projet dbt sans connexion Snowflake
        working-directory: dbt_transformation
        run: dbt parse --target dev --profiles-dir . --no-partial-parse

  build:
    needs: validate
    # La connexion Snowflake est réservée aux lancements manuels.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DBT_ENV_SECRET_ACCOUNT: ${{ secrets.DBT_ENV_SECRET_ACCOUNT }}
      DBT_ENV_SECRET_USER: ${{ secrets.DBT_ENV_SECRET_USER }}
      DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_ENV_SECRET_PASSWORD }}
      DBT_ROLE: ${{ vars.DBT_ROLE || 'DBT_TRANSFORMER' }}
      DBT_DATABASE: ${{ vars.DBT_DATABASE || 'ANALYTICS' }}
      DBT_SCHEMA: ${{ vars.DBT_SCHEMA || 'DBT_DEV' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer dbt
        run: pip install -r requirements-dbt.txt
      - name: Vérifier la configuration Snowflake
        run: |
          if [ -z "$DBT_ENV_SECRET_ACCOUNT" ] || [ -z "$DBT_ENV_SECRET_USER" ] || [ -z "$DBT_ENV_SECRET_PASSWORD" ]; then
            echo "::error::Configurer les trois secrets DBT_ENV_SECRET_* avant de lancer le build Snowflake."
            exit 1
          fi
      - name: Vérifier la connexion et exécuter dbt
        working-directory: dbt_transformation
        run: |
          dbt debug --target dev --profiles-dir .
          dbt build --target dev --profiles-dir .
